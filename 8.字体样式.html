<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .color {
      color: pink;
    }

    .color16 {
      color: #ff0000;
    }

    .rgb {
      color: rgb(0, 155, 100);
    }

    .rgba {
      color: rgba(200, 0, 0, 0.5);
      background-color: gray;
    }

    .font {
      font-family: "Microsoft YaHei";
    }

    body {
      font-size: 14px;
    }

    .font12 {
      font-size: 12px;
    }

    .font16 {
      font-size: 16px;
    }

    .italic {
      font-style: italic;
    }

    .normal {
      font-style: normal;
    }

    .nobold {
      font-weight: 400;
    }

    .bold {
      font-weight: 700;
    }

    .underline {
      text-decoration: underline;
    }

    .overline {
      text-decoration: overline;
    }

    .line-through {
      text-decoration: line-through;
    }


    a {
      text-decoration: none;
    }
  </style>
</head>

<body>
  <h2>1.字体颜色</h2>
  <p class="color">颜色名称</p>
  <p class="color16">十六进制颜色设置</p>
  <p class="rgb">rgb或rgba</p>
  <p class="rgba">半透明文字</p>
  <h2>2.设置字体族</h2>
  <p class="font">字体族可以使用字体名称</p>
  <h2>3.设置字体大小</h2>
  <p class="font16">字体大小可以使用px设置</p>
  <p>字体大小可以使用px设置</p>
  <p class="font12">字体大小可以使用px设置</p>
  <h2>4.设置字体倾斜</h2>
  <p class="italic">字体样式倾斜可以通过italic设置</p>
  <em class="normal">字体取消倾斜可以用normal设置</em>
  <h2 class="nobold">5.设置字体粗细</h2>
  <p class="bold">字体粗细可以使用关键字bold或数字700加粗</p>

  <h2>6.字体装饰</h2>
  <p class="underline">字体装饰可以使用underline下划线设置</p>
  <p class="overline">字体装饰可以使用overline上划线设置</p>
  <p class="line-through">字体装饰可以使用line-through删除线设置</p>
  <a href="#">链接可使用none取消下划线</a>
</body>

</html>
