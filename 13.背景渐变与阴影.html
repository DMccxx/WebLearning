<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 盒子线性渐变 */
    .box {
      width: 800px;
      height: 200px;
      background-image: linear-gradient(90deg, aqua, red);
    }

    /* 文字线性渐变 */
    .text {
      font-size: 30px;
      font-weight: 700;
      /* 让盒子宽度贴合文字，渐变才能刚好铺满"整段文字"左右 */
      width: fit-content;
      background-image: linear-gradient(90deg, green, yellow 34%, blue 72%, red);
      /* 文字渐变 */
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;

    }

    /* 径向渐变 */
    .box1 {
      width: 500px;
      height: 300px;
      background-image: radial-gradient(yellow, rgb(0, 60, 255), rgb(255, 0, 149));
    }

    .box2 {
      width: 400px;
      height: 200px;
      background-color: pink;
      /* 阴影：x y 模糊距离 扩散距离 颜色 */
      /* box-shadow: 0 0 10px 10px rgba(134, 130, 130, .5); */
      transition: all .4s;
    }

    .box2:hover {
      box-shadow: 0 0 10px 10px rgba(134, 130, 130, .5);
      width: 450px;
      height: 250px;
    }

    .kk {
      width: 200px;
      /* 高度一定要修改为想显示的高度 */
      height: 48px;
      background-color: pink;
      /* 旧版弹性盒子布局 */
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      /* 标准属性写在私有属性之后，便于未来浏览器直接支持时生效 */
      line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div class="box"></div>
  <p class="text">我是一段线性渐变文字</p>
  <div class="box1"></div>
  <div class="box2"></div>
  <div class="kk">蔡徐坤是我国知名的篮球明星，他拥有超高的球技，会唱歌、跳舞、rap和篮球，一首鸡你太美火到现在</div>
</body>

</html>
