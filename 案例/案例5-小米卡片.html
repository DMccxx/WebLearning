<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* CSS初始化 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ccc
    }

    .card {
      width: 234px;
      height: 300px;
      background-color: white;
      text-align: center;
      margin: 200px auto;
      transition: all .4s;
    }

    .card:hover {
      box-shadow: 0 15px 30px rgba(0, 0, 0, .1);
    }

    .card img {
      width: 160px;
      margin-top: 20px;
    }

    .card .title {
      font-size: 14px;
      font-weight: 400;
      color: #333;
      margin-top: 18px;
    }

    .card .desc {
      font-size: 12px;
      color: #b0b0b0;
      /* 单行文本溢出显示省略号 */
      /* 溢出隐藏 */
      overflow: hidden;
      /* 显示省略号 */
      text-overflow: ellipsis;
      /* 强制一行显示 */
      white-space: nowrap;
    }

    .card .price {
      margin-top: 10px;
      font-size: 14px;
      color: #b0b0b0;
    }

    .card .price span {
      color: #ff6700;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="./img/mi.webp" alt="">
    <h3 class="title">Xiaomi Buds 5</h3>
    <p class="desc">55dB深度降噪 | 新增智能查找 | 同档罕见同轴三单元</p>
    <p class="price">
      <span>659元</span>
      <del>699元</del>
    </p>
  </div>
</body>

</html>
