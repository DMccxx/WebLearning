<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>元素分类</title>
</head>

<body>
  <!-- 块级元素 -->
  <h1>我是块级元素</h1>
  <p>我也是块级元素</p>
  <!-- 注意：p里面不能包含其他块级元素 -->
  <div>我也是块级元素</div>
  <div>我也是块级元素</div>



  <!-- 行内元素（内联元素） -->
  <strong>我是内联元素</strong><strong>我是内联元素</strong>
  <em>我也是内联元素</em><del>我还是内联元素</del><ins>我也是内联元素</ins>

  <hr>
  <h2>图像标签的使用</h2>
  <img src="./img/kunkun.jpg" alt="坤坤图片"><img src="./img/kunkun1.jpg" alt="坤坤图片">
  <h2>改变宽度高度</h2>
  <img width="200px" src="./img/kunkun.jpg" alt="坤坤图片">
  <img height="200px" src="./img/kunkun.jpg" alt="坤坤图片">
  <img width="300px" title="你干嘛哈哈哎呦！" src="./img/kunkun.jpg" alt="坤坤图片">

  <h2>不同类型图片</h2>
  <img src="./img/0.gif" alt="坤坤跳舞">
  <img src="/img/logo.png" alt="">
  <img src="./img/1.webp" alt="">
  <img width="600px" src="img/2.jpg" alt="">

</body>

</html>
