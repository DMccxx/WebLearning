<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    }

    a {
      text-decoration: none;
    }

    ul,
    li {
      list-style: none;
    }

    .subbar {
      width: 200px;
      height: 300px;
      background-color: rgba(107, 101, 102, 0.692);
      margin: 100px auto;
      padding: 20px 0;
      font-size: 14px;
    }

    .subbar ul li a {
      display: block;
      height: 30px;
      line-height: 30px;
      color: white;
      padding-left: 20px;
    }

    .subbar li:hover a {
      background-color: #f59000;
    }

    .box1 {
      width: 200px;
      height: 200px;
      border: #ccc 1px solid;
    }

    .box1 a {
      display: inline-block;
      padding: 0 10px;
      margin: 5px;
      height: 30px;
      line-height: 30px;
      background-color: pink;
      border-radius: 5px;
      font-size: 14px;
      color: #3350f2;

    }
  </style>
</head>

<body>
  <div class="subbar">
    <ul>
      <li><a href="#">手机</a></li>
      <li><a href="#">电视</a></li>
      <li><a href="#">电脑</a></li>
      <li><a href="#">智能家居</a></li>
      <li><a href="#">智能穿戴</a></li>
      <li><a href="#">智能配件</a></li>
      <li><a href="#">智能硬件</a></li>
      <li><a href="#">新品</a></li>
      <li><a href="#">活动</a></li>
    </ul>
  </div>
  <div class="box1">
    <a href="#">壁纸</a>
    <a href="#">相机</a>
    <a href="#">香蕉</a>
    <a href="#">苹果</a>
    <a href="#">qq图像</a>
    <a href="#">小米</a>
    <a href="#">蔡徐坤</a>
  </div>
</body>

</html>
