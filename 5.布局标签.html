<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>网页结构标签</h2>
  <header>网页头部标签</header>
  <nav>网页导航标签</nav>
  <main>
    <section>网页主体标签</section>
    <article>网页文章标签</article>
    <aside>网页侧边栏标签</aside>
  </main>
  <footer>网页底部标签</footer>
  <hr>
  <h2>无语义标签</h2>
  <div>网页div标签</div>
  <span>网页span标签</span>
  <span>网页span标签</span>
  <hr>
  <h2>列表标签</h2>
  <h3>无序列表</h3>
  <ul>
    <li>语文</li>
    <li>数学</li>
    <li>英语</li>
  </ul>
  <h3>有序列表</h3>
  <ol>
    <li>看视频</li>
    <li>写代码</li>
    <li>做笔记</li>
    <li>总结</li>
  </ol>
  <h3>描述列表（自定义列表）</h3>
  <dl>
    <dt>家电</dt>
    <dd>电视</dd>
    <dd>空调</dd>
    <dd>冰箱</dd>
    <dt>手机</dt>
    <dd>华为</dd>
    <dd>小米</dd>
    <dd>苹果</dd>
  </dl>
</body>

</html>
