<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./iconfont/iconfont.css ">
  <style>
    ul,
    li {
      list-style: none;

    }

    a {
      color: black;
      text-decoration: none;
    }

    .iconfont {
      font-size: 30px;
    }

    .sanlian {
      display: flex;
    }

    .sanlian li {

      width: 60px;
      height: 80px;
      /* border: 1px solid red; */
    }

    .sanlian li a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .fa {
      width: 800px;
      border: 1px solid red;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .son {
      width: 180px;
      height: 300px;
      background-color: pink;
      margin-bottom: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <ul class="sanlian">
    <li>
      <a href="#">
        <i class="iconfont icon-dianzan"></i>
        <p>点赞</p>
      </a>
    </li>
    <li>
      <a href="#">
        <i class="iconfont icon-yingbi"></i>
        <p>硬币</p>
      </a>
    </li>
    <li>
      <a href="#">
        <i class="iconfont icon-shoucang"></i>
        <p>收藏</p>
      </a>
    </li>
  </ul>
  <div class="fa">
    <div class="son">1</div>
    <div class="son">2</div>
    <div class="son">3</div>
    <div class="son">4</div>
    <div class="son">5</div>
    <div class="son">6</div>
    <div class="son">7</div>
    <div class="son">8</div>
    <div class="son">9</div>
    <div class="son">10</div>
    <div class="son">11</div>
    <div class="son">12</div>
    <div class="son">13</div>
    <div class="son">14</div>
    <div class="son">15</div>

  </div>
</body>

</html>
